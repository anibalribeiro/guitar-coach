name: Deploy Guitar Coach to anibalribeiro.cz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: anibalribeiro.cz
      url: https://anibalribeiro.cz/guitar-coach/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify app and BLE refusal
        run: |
          node --test
          python3 tests/test_probe_refusal.py

      - name: Install FTP client
        run: npm install --no-save --no-package-lock basic-ftp@6.2.1

      - name: Upload app/ over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: node tools/deploy_ftp.mjs
